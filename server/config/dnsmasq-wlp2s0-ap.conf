# dnsmasq scoped to the management AP interface only.
# bind-interfaces + interface= keeps this off systemd-resolved's port 53
# (127.0.0.53/54) and off every capture/uplink interface.
interface=wlp2s0
bind-interfaces
except-interface=lo

dhcp-range=10.42.0.10,10.42.0.200,255.255.255.0,12h
dhcp-option=3,10.42.0.1
dhcp-option=6,10.42.0.1

domain=wids.local
local=/wids.local/
