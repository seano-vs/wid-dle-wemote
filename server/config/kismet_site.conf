# WIDS rig — site overrides. This file wins over the packaged kismet*.conf
# files and survives package upgrades.

# ---------------------------------------------------------------------------
# HARD CONSTRAINT: no pcap / no raw traffic to disk, ever.
# Kismet ships enable_logging=true with kis_log_packets=true, which would write
# a kismetdb containing packet data. Everything below is live/eventbus only.
# ---------------------------------------------------------------------------
enable_logging=false
kis_log_packets=false
kis_log_data_packets=false
pcapng_log_data_packets=false

# ---------------------------------------------------------------------------
# Capture sources. wids-monitor.service has already placed these in monitor
# mode on their assigned channels; names are pinned by udev MAC rules.
# wlp2s0 (management AP) is deliberately absent and must never be listed here.
#
# 2.4GHz: pinned 1/6/11 so that band is never unwatched.
# 5GHz:   split hop across UNII-1/2 and UNII-2e/3.
# ---------------------------------------------------------------------------
source=mon2:name=mon2_ch1,channel=1,channel_hop=false
source=mon3:name=mon3_ch6,channel=6,channel_hop=false
source=mon4:name=mon4_ch11,channel=11,channel_hop=false
source=mon0:name=mon0_5g_low,channels="36,40,44,48,52,56,60,64",channel_hop=true,channel_hoprate=5/sec
source=mon1:name=mon1_5g_high,channels="100,104,108,112,149,153,157,161,165",channel_hop=true,channel_hoprate=5/sec

# Do not auto-adopt radios that are not explicitly listed above.
allowremotecapture=false

# ---------------------------------------------------------------------------
# Local REST/eventbus only — bound to loopback. The detection daemon is the
# only consumer.
# ---------------------------------------------------------------------------
httpd_bind_address=127.0.0.1
httpd_port=2501
