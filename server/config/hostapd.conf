# WIDS rig management AP — wlp2s0 (built-in radio, never monitor mode)
interface=wlp2s0
driver=nl80211

ssid=example wids ssid
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
country_code=US

# WPA2-PSK. Set a real passphrase before deploying (installer can generate one).
# To rotate: edit wpa_passphrase below, then systemctl restart hostapd
wpa=2
wpa_passphrase=CHANGE_ME_PSK
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
auth_algs=1

ignore_broadcast_ssid=0
