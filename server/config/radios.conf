# WIDS capture radio plan.   <iface> <mac> <chipset> <role> <params>
#
# NOTE: the AA:BB:CC:00:00:0N MACs below are PLACEHOLDERS. Replace them with
# your radios' real MACs (see `ip -br link`), or let `wids-add-radio` fill them.
#
# roles:
#   pin      <channel>     Fixed channel. wids-monitor-setup + watchdog hold it;
#                          Kismet source is channel_hop=false.
#   hop      <ch,ch,...>   Kismet hops this list at channel_hoprate.
#   scout    <ch,ch,...>   Like hop, but its sweep is what feeds wids-chanctl's
#                          per-channel ranking for the trackers.
#   tracker  <ch,ch,...>   Channel is owned by wids-chanctl: dynamically parked
#                          on the hottest channel in this pool. setup/watchdog do
#                          NOT pin it. Its Kismet source MUST be channel_hop=false.
#
# 2.4 GHz: 3x AR9271 pinned 1/6/11 — the only non-overlapping channels, so this
#          covers the whole useful band continuously.
# 5 GHz  : CURRENT (2 radios) — hop the low and high halves.

mon2 AA:BB:CC:00:00:02 ar9271  pin  1
mon3 AA:BB:CC:00:00:03 ar9271  pin  6
mon4 AA:BB:CC:00:00:04 ar9271  pin  11
mon0 AA:BB:CC:00:00:00 mt7612u hop  36,40,44,48,52,56,60,64
mon1 AA:BB:CC:00:00:01 mt7612u hop  100,104,108,112,149,153,157,161,165

# ---------------------------------------------------------------------------
# FUTURE 4x 5 GHz plan — for the two extra (identical MT7612U) sticks.
#
# On arrival: plug ONE stick in, then run  `sudo wids-add-radio`  and answer the
# role prompt. It reads the new interface's MAC, assigns the next mon name,
# writes the udev rule + this file + the Kismet source, and reloads. Repeat for
# the second stick.
#
# Target once both are in (also switch mon0/mon1 from hop -> pin as below, so the
# two always-hot non-DFS blocks are watched continuously and the new pair does
# scout + dynamic DFS tracking):
#
#   mon0 AA:BB:CC:00:00:00 mt7612u pin     36                       # UNII-1 primary
#   mon1 AA:BB:CC:00:00:01 mt7612u pin     149                      # UNII-3 primary
#   mon5 <newmac1>         mt7612u scout   36,40,44,48,52,56,60,64,100,104,108,112,116,120,124,128,132,136,140,144,149,153,157,161,165
#   mon6 <newmac2>         mt7612u tracker 52,56,60,64,100,104,108,112,116,120,124,128,132,136,140,144
#
# (The tracker pool is the DFS range incl. the TDWR band 120-128 — the Vegas
#  airport-radar hotspot — which the current 2-radio config never reaches.)
# ---------------------------------------------------------------------------
