# WIDS capture radio plan.   <iface> <mac> <chipset> <role> <params>
#
# NOTE: the AA:BB:CC:00:00:0N MACs are PLACEHOLDERS. Replace with your radios'
# real MACs (see `ip -br link`), or let `wids-add-radio` fill them.
#
# roles:
#   pin      <channel>     Fixed channel; Kismet locked, watchdog holds it.
#   hop      <ch,ch,...>   Kismet hops this list.
#   scout    <ch,ch,...>   Like hop; its sweep feeds wids-chanctl's ranking.
#   tracker  <ch,ch,...>   Channel owned by wids-chanctl (parks on the hottest
#                          in this pool). setup/watchdog don't pin it; its Kismet
#                          source is channel_hop=false.
#
# Reference build = 7 capture radios:
#   2.4 GHz: 3x AR9271 pinned 1/6/11 (only non-overlapping channels).
#   5 GHz (4x MT7612U):
#     mon0 hop UNII-1 (36-48), mon1 hop UNII-3 (149-165)  — non-DFS, where APs live.
#     mon5 scout sweeps DFS (52-64 + 100-144, incl. the TDWR band 120-128).
#     mon6 tracker: wids-chanctl parks it on the hottest DFS channel found.

mon2 AA:BB:CC:00:00:02 ar9271  pin      1
mon3 AA:BB:CC:00:00:03 ar9271  pin      6
mon4 AA:BB:CC:00:00:04 ar9271  pin      11
mon0 AA:BB:CC:00:00:00 mt7612u hop      36,40,44,48
mon1 AA:BB:CC:00:00:01 mt7612u hop      149,153,157,161,165
mon5 AA:BB:CC:00:00:05 mt7612u scout    52,56,60,64,100,104,108,112,116,120,124,128,132,136,140,144
mon6 AA:BB:CC:00:00:06 mt7612u tracker  52,56,60,64,100,104,108,112,116,120,124,128,132,136,140,144
