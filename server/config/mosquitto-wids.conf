# WIDS event bus. Ephemeral by design: detections are fire-and-forget, only
# gauge/rollup topics retain a last value. Nothing queues to disk.

persistence false
autosave_interval 0

# Loopback for the local daemon + exporter.
listener 1883 127.0.0.1
allow_anonymous true

# Management AP subnet, so the future LED bridge and TV display can subscribe
# as independent consumers without touching the daemon.
listener 1883 10.42.0.1
allow_anonymous true

# Never expose the bus on the LAN uplink (enp1s0). If a remote consumer is
# needed later, add an explicit listener and authentication here.

max_queued_messages 1000
message_size_limit 262144
